<main class="auth-page">
  <section class="card card-pad auth-card">
    <a class="brand mb-8" routerLink="/" aria-label="Projectly, inicio"><app-brand-logo /></a>
    <h1 class="page-title">{{ register() ? 'Crea tu cuenta' : 'Bienvenido de nuevo' }}</h1>
    <p class="page-subtitle mb-6">Tu trabajo, organizado en un solo lugar.</p>
    @if (auth.isDemo) {
      <div class="notice">La aplicación está en modo de demostración.</div>
      <a class="btn btn-primary mt-4" routerLink="/mis-tareas">Explorar el espacio</a>
    } @else {
      <form class="form-grid" (ngSubmit)="submit()">
        <div class="form-row">
          <label for="email">Correo</label
          ><input
            id="email"
            type="email"
            name="email"
            required
            autocomplete="email"
            [(ngModel)]="email"
          />
        </div>
        <div class="form-row">
          <label for="password">Contraseña</label
          ><input
            id="password"
            type="password"
            name="password"
            required
            minlength="8"
            [autocomplete]="register() ? 'new-password' : 'current-password'"
            [(ngModel)]="password"
          />
        </div>
        @if (message()) {
          <p class="notice" role="status">{{ message() }}</p>
        }
        <button class="btn btn-primary" [disabled]="busy()">
          {{ busy() ? 'Un momento…' : register() ? 'Crear cuenta' : 'Iniciar sesión' }}
        </button>
      </form>
      <button class="text-link mt-5" (click)="register.set(!register()); message.set('')">
        {{ register() ? 'Ya tengo cuenta' : 'Crear una cuenta' }}
      </button>
    }
  </section>
</main>
