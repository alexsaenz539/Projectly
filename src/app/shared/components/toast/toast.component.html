<div class="toast-stack" aria-label="Avisos del sistema">
  @for (item of toasts.messages(); track item.id) {
    <div
      class="system-toast"
      [attr.data-kind]="item.kind"
      (mouseenter)="toasts.pause(item.id, 'hover')"
      (mouseleave)="toasts.resume(item.id, 'hover')"
      (focusin)="toasts.pause(item.id, 'focus')"
      (focusout)="toasts.resume(item.id, 'focus')"
    >
      <div [attr.role]="item.kind === 'error' ? 'alert' : 'status'" aria-atomic="true">
        <strong>{{ labels[item.kind] }}</strong>
        <p>{{ item.message }}</p>
      </div>
      <button
        class="icon-btn"
        type="button"
        [attr.aria-label]="'Cerrar aviso: ' + labels[item.kind]"
        (click)="toasts.dismiss(item.id)"
      >
        ×
      </button>
      @if (item.kind !== 'error') {
        <div class="toast-countdown" aria-hidden="true">
          <span
            class="toast-countdown-fill"
            [style.animation-play-state]="item.paused ? 'paused' : 'running'"
          ></span>
        </div>
      }
    </div>
  }
</div>
